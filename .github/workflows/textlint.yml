name: textlint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm i --no-save textlint @textlint/textlint-plugin-markdown textlint-rule-preset-ja-technical-writing textlint-rule-preset-jtf-style textlint-rule-no-dead-link

      - name: Run textlint
        run: |
          npx textlint -f stylish "**/*.md" --ignore-path .gitignore
